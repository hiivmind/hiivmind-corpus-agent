  corpus_ready: tools.corpus:corpus_ready
  refresh_needed: tools.corpus:refresh_needed
  source_freshness: tools.corpus:source_freshness
  stale_batches: tools.corpus:stale_batches
  apply_source_update: tools.corpus:apply_source_update
  drop_missing: tools.corpus:drop_missing
  merge_scans: tools.corpus:merge_scans
  set_concepts: tools.corpus:set_concepts
  set_summary: tools.corpus:set_summary
  stale_entries: tools.corpus:stale_entries
  verify_previews: tools.corpus:verify_previews
  embeddings_status: tools.corpus:embeddings_status
  embed: tools.corpus:embed
  embeddings_lag: tools.corpus:embeddings_lag
  reference: tools.corpus:reference
  corpus_status: tools.corpus:corpus_status
  index_is_v2: tools.corpus:index_is_v2
  index_is_v1: tools.corpus:index_is_v1
  sources_handled: tools.corpus:sources_handled
  graph_exists: tools.corpus:graph_exists
  migrate_index: tools.corpus:migrate_index
