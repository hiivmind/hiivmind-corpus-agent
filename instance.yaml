name: corpus
core: 0
entry: topology.yaml
policy: POLICY.md
backend: langgraph
servers:
  shell: {command: python, args: [-m, agent_tools.shell_server]}
  files: {command: npx, args: [-y, "@modelcontextprotocol/server-filesystem", "/"]}
settings:
  class: settings.CorpusSettings
  files: [config/base.yaml]
  env_prefix: HIIVMIND_CORPUS_
tools:
  corpus_status: tools.status:corpus_status
  repo_prepare: tools.repo:repo_prepare
  repo_branch: tools.repo:repo_branch
  repo_finish: tools.repo:repo_finish
  stale_files: tools.index:stale_files
  apply_scan: tools.index:apply_scan
