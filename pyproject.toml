[project]
name = "hiivmind-corpus-agent"
version = "0.1.0"
description = "A corpus instance for agent-core: refresh a documentation corpus and open a pull request"
requires-python = ">=3.12"
dependencies = [
    "agent-core[langgraph]",
    "agent-tools",
    "mountainash-settings",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.sources]
agent-core = { path = "../hiivmind-agent-core" }
agent-tools = { path = "../hiivmind-agent-core/packages/agent-tools" }
mountainash-settings = { git = "ssh://git@github.com/mountainash-io/mountainash-settings.git", rev = "7a4b43bf4789b43a808ca1520012fc413d221e64" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["model: calls a model provider and costs money"]
# Run pytest from the repository root: --basetemp is relative to it. The temporary directories are kept out of any
# hidden directory (TMPDIR may point into one) because the snap `yq` cannot read a hidden directory.
addopts = "-m 'not model' --basetemp=test-tmp"
