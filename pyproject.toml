[project]
name = "hiivmind-corpus-agent"
version = "0.1.0"
description = "A corpus instance for agent-core: refresh a documentation corpus and open a pull request"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-core[langgraph,anthropic]",
    "agent-tools",
    "hiivmind-corpus-lib[embeddings]",
    "mountainash-settings",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.sources]
agent-core = { path = "../hiivmind-agent-core", editable = true }
agent-tools = { path = "../hiivmind-agent-core/packages/agent-tools", editable = true }
hiivmind-corpus-lib = { path = "../hiivmind-corpus-lib", editable = true }
mountainash-settings = { git = "ssh://git@github.com/mountainash-io/mountainash-settings.git", rev = "7a4b43bf4789b43a808ca1520012fc413d221e64" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["v0"]
pythonpath = ["."]
markers = ["model: calls a model provider and costs money"]
# Run pytest from the repository root: --basetemp is relative to it.
addopts = "-m 'not model' --basetemp=test-tmp"
